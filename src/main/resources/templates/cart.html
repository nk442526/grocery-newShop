<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Your Cart</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        .cart-item {
            background: white;
            width: 350px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        img {
            width: 120px;
            height: 120px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<h1>Your Cart</h1>

<div class="cart-item" th:each="item : ${cartItems}">

    <img th:src="${item.image}">

    <h3 th:text="${item.name}"></h3>

    <p>
        Price: ₹ <span th:text="${item.price}"></span>
    </p>

    <p>
        Quantity: <span th:text="${item.quantity}"></span>
    </p>

    <p>
        Total: ₹ <span th:text="${item.price * item.quantity}"></span>
    </p>

</div>

<h2>
    Grand Total: ₹ <span th:text="${total}"></span>
</h2>

<br>

<a href="/checkout">
    <button>Proceed To Checkout</button>
</a>

<br><br>

<a href="/">
    <button>Back To Home</button>
</a>

</body>
</html>
