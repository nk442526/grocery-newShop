<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        .checkout-box {
            background: white;
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="checkout-box">

    <h1>Checkout</h1>

    <input type="text" placeholder="Enter Your Name">

    <br>

    <input type="text" placeholder="Enter Phone Number">

    <br>

    <textarea placeholder="Enter Address"></textarea>

    <br><br>

    <h3>Payment Method</h3>

    <p>Cash On Delivery</p>

    <p>UPI: ritagrocery@paytm</p>

    <br>

    <a href="/order-success">
        <button>Place Order</button>
    </a>

</div>

</body>
</html>
