<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Rita Grocery Store</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            color: green;
        }

        .product-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 0 10px lightgray;
        }

        img {
            width: 150px;
            height: 150px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

    </style>

</head>

<body>

<h1>Rita Grocery Store</h1>

<br>

<a href="/cart">
    <button>View Cart</button>
</a>

<br><br>

<div class="product-container">

    <div class="product-card" th:each="product : ${products}">

        <img th:src="${product.image}">

        <h3 th:text="${product.name}"></h3>

        <p>
            ₹ <span th:text="${product.price}"></span>
        </p>

        <a th:href="@{'/add-to-cart/' + ${product.id}}">
            <button>
                Add To Cart
            </button>
        </a>

    </div>

</div>

</body>
</html>
